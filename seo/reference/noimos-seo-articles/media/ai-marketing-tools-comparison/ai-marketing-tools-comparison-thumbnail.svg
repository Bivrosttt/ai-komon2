    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".98"/><stop offset="1" stop-color="#dff5f1" stop-opacity=".9"/></linearGradient>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <path d="M-80 670 620 0h170L90 900H-80ZM530 900 1460 0h220L760 900H530Z" fill="#fff" opacity=".08"/>
  <text x="100" y="142" fill="#bfe7e1" font-family="Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="8">AI MARKETING / COMPARISON GUIDE</text>
