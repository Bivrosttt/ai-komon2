    <g transform="translate(54 56)">
      <rect width="250" height="130" rx="20" fill="url(#card)"/><text x="32" y="58" fill="#082448" font-family="Arial, sans-serif" font-size="30" font-weight="700">Research</text><text x="32" y="96" fill="#1769aa" font-family="Arial, sans-serif" font-size="22">競合・需要</text>
    </g>
    <g transform="translate(370 56)">
      <rect width="250" height="130" rx="20" fill="url(#card)"/><text x="32" y="58" fill="#082448" font-family="Arial, sans-serif" font-size="30" font-weight="700">Create</text><text x="32" y="96" fill="#1769aa" font-family="Arial, sans-serif" font-size="22">SEO・GEO</text>
    </g>
    <g transform="translate(686 56)">
      <rect width="250" height="130" rx="20" fill="url(#card)"/><text x="32" y="58" fill="#082448" font-family="Arial, sans-serif" font-size="30" font-weight="700">Execute</text><text x="32" y="96" fill="#1769aa" font-family="Arial, sans-serif" font-size="22">SNS・CRM</text>
    </g>
    <g transform="translate(1002 56)">
      <rect width="250" height="130" rx="20" fill="url(#card)"/><text x="32" y="58" fill="#082448" font-family="Arial, sans-serif" font-size="30" font-weight="700">Improve</text><text x="32" y="96" fill="#1769aa" font-family="Arial, sans-serif" font-size="22">計測・更新</text>
