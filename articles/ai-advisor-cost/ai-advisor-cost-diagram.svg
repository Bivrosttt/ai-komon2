<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI顧問の年間総費用を分解する図</title>
  <desc id="desc">月額だけでなく初期費用、従量費、追加作業費、社内確認工数を足して年間総費用を計算する。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071a35"/><stop offset="1" stop-color="#19376d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#f4f7fa"/>
  <rect x="50" y="45" width="1500" height="810" rx="32" fill="url(#bg)" filter="url(#shadow)"/>
  <text x="110" y="130" fill="#fff" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="46" font-weight="800">AI顧問の費用は「月額」ではなく総額で見る</text>
  <text x="110" y="178" fill="#d9e5f0" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="25">契約前に、支援範囲・追加費用・社内の確認時間まで同じ表へ入れる</text>
  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" font-weight="700">
    <rect x="125" y="260" width="235" height="150" rx="18" fill="#d2a61f"/>
    <text x="242" y="318" text-anchor="middle" fill="#071a35" font-size="28">初期費用</text><text x="242" y="360" text-anchor="middle" fill="#071a35" font-size="21">診断・設計・設定</text>
    <rect x="400" y="220" width="275" height="190" rx="18" fill="#e8c95e"/>
    <text x="537" y="290" text-anchor="middle" fill="#071a35" font-size="30">月額固定費</text><text x="537" y="335" text-anchor="middle" fill="#071a35" font-size="21">伴走・会議・改善</text><text x="537" y="373" text-anchor="middle" fill="#071a35" font-size="19">× 契約月数</text>
    <rect x="715" y="260" width="235" height="150" rx="18" fill="#a9c4d8"/>
    <text x="832" y="318" text-anchor="middle" fill="#071a35" font-size="28">従量費</text><text x="832" y="360" text-anchor="middle" fill="#071a35" font-size="21">ツール・API・外部費</text>
    <rect x="990" y="220" width="235" height="190" rx="18" fill="#7fa3c2"/>
    <text x="1107" y="290" text-anchor="middle" fill="#071a35" font-size="28">追加作業費</text><text x="1107" y="335" text-anchor="middle" fill="#071a35" font-size="21">改修・連携・出張</text><text x="1107" y="373" text-anchor="middle" fill="#071a35" font-size="19">範囲外を明記</text>
    <rect x="1265" y="260" width="205" height="150" rx="18" fill="#b9d3df"/>
    <text x="1367" y="318" text-anchor="middle" fill="#071a35" font-size="26">社内工数</text><text x="1367" y="360" text-anchor="middle" fill="#071a35" font-size="21">確認・教育・運用</text>
  </g>
  <g stroke="#d2a61f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M242 454v80h1110"/><path d="M1352 534l-25-20m25 20l-25 20"/></g>
  <rect x="300" y="580" width="1000" height="150" rx="22" fill="#fff"/>
  <text x="800" y="640" text-anchor="middle" fill="#071a35" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="34" font-weight="800">年間総費用</text>
  <text x="800" y="690" text-anchor="middle" fill="#334155" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="26">初期 + 月額×月数 + 従量 + 追加作業 + 社内確認</text>
  <text x="110" y="805" fill="#d9e5f0" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="22">判断ルール: 料金の大小ではなく、成果物・承認点・契約終了条件が自社の業務に合うか確認する</text>
</svg>
